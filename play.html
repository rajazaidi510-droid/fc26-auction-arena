<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FC26 Auction</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>window.Peer||document.write('<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"><\/script>');</script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1f18;color:#e8f0eb;font:16px system-ui,sans-serif;padding:16px;text-align:center}</style>
</head>
<body>
<p id="m">Loading FC26 Auction...</p>
<script>
(async function () {
  var m = document.getElementById('m');
  var WANT = { engine: '44034e3dcf9ba52ac171703bd19e6675ee0e6b4d150d4e442c9c1c3c747e7983', page: 'cc0b6c71d2c1d6dd6e2c6421af8b599bb61d3d5149adfa7659efb12eda20e57a' };
  async function sha(s) {
    var d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return Array.from(new Uint8Array(d), function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }
  function start(parts) {
    var marker = '<script src="/engine.js"><\/script>';
    var page = parts[2] + parts[3];
    if (page.indexOf(marker) < 0) { m.textContent = 'index.html looks incomplete. Re-check the pasted files.'; return; }
    var html = page.replace(marker, function () {
      return '<script>' + parts[0] + parts[1] + '<\/script>\n<script>' + parts[4] + '<\/script>';
    });
    document.open();
    document.write(html);
    document.close();
  }
  try {
    if (typeof Peer === 'undefined') throw new Error('The connection library did not load. Check your internet and refresh.');
    var get = async function (f) {
      var r = await fetch(f + '?v=' + Date.now());
      if (!r.ok) throw new Error('Missing file on GitHub: ' + f);
      return r.text();
    };
    var parts = await Promise.all([get('engine.js'), get('engine_b.js'), get('index.html'), get('index_b.html'), get('p2p.js')]);
    var bad = [];
    if (await sha(parts[0] + parts[1]) !== WANT.engine) bad.push('engine.js and engine_b.js');
    if (await sha(parts[2] + parts[3]) !== WANT.page) bad.push('index.html and index_b.html');
    if (bad.length) {
      m.innerHTML = '';
      var t = document.createElement('div');
      t.textContent = 'These files on GitHub do not match the tested copy: ' + bad.join(' and ') + '. Re-paste them from the fixed-files page.';
      var b = document.createElement('button');
      b.textContent = 'Play anyway';
      b.style.cssText = 'margin-top:14px;min-height:48px;padding:0 18px;border-radius:10px;border:2px solid #1B1500;background:#FFD23F;color:#1B1500;font:600 16px system-ui';
      b.onclick = function () { start(parts); };
      m.appendChild(t); m.appendChild(b);
      return;
    }
    start(parts);
  } catch (e) {
    m.textContent = e.message;
  }
})();
</script>
</body>
</html>
